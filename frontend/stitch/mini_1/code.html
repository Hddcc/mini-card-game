<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-background/50"></div>

</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[420px] flex flex-col gap-stack-lg">
<!-- Header / Logo Section -->
<header class="flex flex-col items-center gap-stack-md text-center">
<div class="w-20 h-20 bg-ink-wash border-2 border-primary-container rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(255,215,0,0.2)]">
<span class="material-symbols-outlined text-primary-fixed text-[40px]" data-icon="temple_buddhist">temple_buddhist</span>
</div>
<div>
<h1 class="font-display-hero text-headline-lg-mobile md:text-display-hero text-primary-fixed glow-gold mb-1">Mini 西游</h1>
<p class="font-label-sm text-on-surface-variant tracking-widest uppercase">古老智慧 · 现代征途</p>
</div>
</header>
<!-- Auth Card -->
<section class="bg-ink-wash relative p-stack-lg border-2 border-outline-variant shadow-2xl rounded-none" id="auth-card">
<!-- Decorative Corners -->
<div class="meander-corner meander-tl"></div>
<div class="meander-corner meander-tr"></div>
<div class="meander-corner meander-bl"></div>
<div class="meander-corner meander-br"></div>
<!-- Tab Switcher -->
<div class="flex border-b border-outline-variant mb-stack-lg">
<button class="flex-1 py-stack-md font-title-md text-primary-fixed border-b-2 border-primary-fixed transition-all" id="tab-login" onclick="switchTab('login')">登录</button>
<button class="flex-1 py-stack-md font-title-md text-on-surface-variant border-b-2 border-transparent transition-all" id="tab-register" onclick="switchTab('register')">注册</button>
</div>
<!-- Error Display (Hidden by default) -->
<div class="hidden mb-stack-md p-stack-md bg-secondary-container text-on-secondary-container border border-secondary flex items-center gap-stack-md animate-pulse" id="error-alert">
    <span class="material-symbols-outlined text-[18px]" id="alert-icon">error</span>
    <span class="font-label-sm" id="error-message">请输入正确的账号密码</span>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md" id="auth-form" onsubmit="handleAuth(event)">
<div class="space-y-stack-xs">
<label class="font-label-sm text-on-surface-variant uppercase ml-1">账号</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary-container">person</span>
<input class="w-full bg-surface-container-low border-b-2 border-outline-variant focus:border-primary-container text-on-surface px-10 py-3 transition-all outline-none placeholder:text-surface-variant" name="username" placeholder="请输入账号" required="" type="text"/>
</div>
</div>
<div class="space-y-stack-xs hidden" id="nickname-field">
<label class="font-label-sm text-on-surface-variant uppercase ml-1">昵称</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary-container">badge</span>
<input class="w-full bg-surface-container-low border-b-2 border-outline-variant focus:border-primary-container text-on-surface px-10 py-3 transition-all outline-none placeholder:text-surface-variant" name="nickname" placeholder="请输入昵称" type="text"/>
</div>
</div>

</div>

<span class="material-symbols-outlined text-primary-fixed">public</span>

</div>

<!-- Micro-interaction Particles (Scripted) -->
<canvas class="fixed inset-0 pointer-events-none z-[5]" id="particle-canvas"></canvas>
<script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const btnText = document.getElementById('btn-text');
            const errorAlert = document.getElementById('error-alert');
            const nicknameField = document.getElementById('nickname-field');
            
            errorAlert.classList.add('hidden');

            if (mode === 'login') {
                loginTab.classList.replace('text-on-surface-variant', 'text-primary-fixed');
                loginTab.classList.replace('border-transparent', 'border-primary-fixed');
                registerTab.classList.replace('text-primary-fixed', 'text-on-surface-variant');
                registerTab.classList.replace('border-primary-fixed', 'border-transparent');
                btnText.textContent = '登录';
                nicknameField.classList.add('hidden');
            } else {
                registerTab.classList.replace('text-on-surface-variant', 'text-primary-fixed');
                registerTab.classList.replace('border-transparent', 'border-primary-fixed');
                loginTab.classList.replace('text-primary-fixed', 'text-on-surface-variant');
                loginTab.classList.replace('border-primary-fixed', 'border-transparent');
                btnText.textContent = '注册';
                nicknameField.classList.remove('hidden');
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const form = event.target;
            const btn = document.getElementById('submit-btn');
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            const alertIcon = document.getElementById('alert-icon');
            
            const username = form.username.value;
            const password = form.password.value;

            // Simple validation UI state
            btn.disabled = true;
            btn.style.opacity = '0.7';
            errorAlert.classList.add('hidden');

            const endpoint = currentMode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';
            const payload = {
                username,
                password
            };
            if (currentMode === 'register') {
                payload.nickname = form.nickname.value.trim();
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!response.ok || data.code !== 0) {
                    showAlert(data.message || '请求失败，请检查输入', 'error');
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    return;
                }

                showAlert(currentMode === 'login' ? '登录成功' : '注册成功', 'success');
                btn.disabled = false;
                btn.style.opacity = '1';
                const card = document.getElementById('auth-card');
                card.classList.add('animate-bounce');
                setTimeout(() => card.classList.remove('animate-bounce'), 500);
                if (currentMode === 'register') {
                    setTimeout(() => {
                        switchTab('login');
                        errorAlert.classList.add('hidden');
                    }, 900);
                    return;
                }
                if (currentMode === 'login') {
                    // save token and go to next page
                    try {
                        const token = data.data && data.data.token;
                        if (token) localStorage.setItem('token', token);
                    } catch (e) {}
                    window.location.href = '/static/mini_5/code.html';
                    return;
                }
            } catch (error) {
                showAlert('网络请求失败，请稍后重试', 'error');
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        function showAlert(message, type) {
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            const alertIcon = document.getElementById('alert-icon');
            errorMessage.textContent = message;
            if (type === 'success') {
                errorAlert.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'border-secondary');
                errorAlert.classList.add('bg-green-600', 'text-white', 'border-green-500');
                alertIcon.textContent = 'check_circle';
            } else {
                errorAlert.classList.remove('bg-green-600', 'text-white', 'border-green-500');
                errorAlert.classList.add('bg-secondary-container', 'text-on-secondary-container', 'border-secondary');
                alertIcon.textContent = 'error';
            }
            errorAlert.classList.remove('hidden');
        }

        // Lightweight atmospheric particles
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedY: Math.random() * -0.5 - 0.2,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.fillStyle = `rgba(255, 215, 0, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initParticles);
        initParticles();
        animate();
    </script>
</body></html>
