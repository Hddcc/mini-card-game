        };
        let heroes = [];
        let activeTeam = [null, null, null, null, null];
        let selectedSlot = null;

        const heroInventory = document.getElementById('heroInventory');
        const slots = document.querySelectorAll('.team-slot');
        const saveBtn = document.getElementById('saveTeamBtn');

        async function apiFetch(path, opts = {}) {
            const token = localStorage.getItem('token');
            if (!token) return window.location.href = '/';
            const headers = opts.headers || {};
            headers['Content-Type'] = headers['Content-Type'] || 'application/json';
            headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(path, Object.assign({}, opts, { headers }));
            if (res.status === 401) {
                localStorage.removeItem('token');
                return window.location.href = '/';
            }
            return res.json();
        }

        function normalizeHero(h) {
            const quality = qualityNames[h.quality] || 'N';
            return {
                id: h.player_hero_id,
                configId: h.hero_config_id,
                name: h.name || '未知英雄',
                quality,
                img: heroImages[h.hero_config_id] || heroImages[1],
                level: h.level || 1,
                star: h.star || 1
            };
        }

        async function init() {
            try {
                const [heroData, teamData, profileData, assetData] = await Promise.all([
                    apiFetch('/api/v1/heroes'),
                    apiFetch('/api/v1/team'),
                    apiFetch('/api/v1/player/profile'),
                    apiFetch('/api/v1/player/assets')
                ]);
                if (heroData && heroData.code === 0 && heroData.data && Array.isArray(heroData.data.heroes)) {
                    heroes = heroData.data.heroes.map(normalizeHero);
                }
                if (teamData && teamData.code === 0 && Array.isArray(teamData.data)) {
                    teamData.data.forEach(s => {
                        if (s.slot && s.player_hero_id) activeTeam[s.slot - 1] = s.player_hero_id;
                    });
                }
                if (profileData && profileData.code === 0 && profileData.data) {
                    const nameEl = document.querySelector('h2.font-title-md');
                    const levelEl = document.querySelector('p.font-label-sm.text-label-sm.text-on-surface-variant');
                    if (nameEl) nameEl.textContent = profileData.data.Nickname || profileData.data.nickname || '取经人';
                    if (levelEl) levelEl.textContent = `等级 ${profileData.data.Level || profileData.data.level || 1}`;
                }
                if (window.loadAssetBar) window.loadAssetBar();
            } catch (err) {
                showToast('加载数据失败，请刷新重试');
            }
            renderInventory();
            activeTeam.forEach((heroId, idx) => {
                const hero = heroes.find(h => h.id === heroId);
                updateSlotUI(idx, hero || null);
            });
            if (slots[0]) slots[0].click();
        }

        function renderInventory() {
            heroInventory.innerHTML = '';
            if (heroes.length === 0) {
                heroInventory.innerHTML = '<div class="col-span-full text-on-surface-variant">暂无英雄，请先前往召唤获得英雄。</div>';
                return;
            }
            heroes.forEach(hero => {
                const isAssigned = activeTeam.includes(hero.id);
                const qualityClass = qualityClasses[hero.quality] || 'quality-n';
                const card = document.createElement('div');
                card.className = `hero-card group relative h-48 cursor-pointer border-2 transition-all ${isAssigned ? 'opacity-30 border-outline-variant grayscale' : 'border-outline hover:border-primary-fixed hover:-translate-y-1'}`;
                card.onclick = () => !isAssigned && handleHeroSelect(hero);
                card.innerHTML = `
                    <div class="absolute inset-0"><img src="${hero.img}" class="w-full h-full object-cover" alt="${hero.name}"></div>
                    <div class="absolute top-2 left-2 px-2 py-0.5 bg-black/70 border border-${qualityClass} rounded-sm">
                        <span class="font-label-sm text-label-sm text-${qualityClass}">${hero.quality}</span>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black to-transparent">
                        <p class="font-title-md text-sm text-white truncate">${hero.name}</p>
                        <p class="font-label-sm text-[10px] text-on-surface-variant uppercase">等级 ${hero.level} · ${hero.star}星</p>
                    </div>`;
                heroInventory.appendChild(card);
            });
        }

        slots.forEach(slot => {
            slot.addEventListener('click', () => {
                const slotIndex = parseInt(slot.dataset.slot, 10) - 1;
                slots.forEach(s => s.classList.remove('border-primary-fixed', 'shadow-[0_0_15px_rgba(255,215,0,0.4)]'));
                slot.classList.add('border-primary-fixed', 'shadow-[0_0_15px_rgba(255,215,0,0.4)]');
                selectedSlot = slotIndex;
            });
            slot.querySelector('.clear-slot').onclick = (e) => {
                e.stopPropagation();
                const slotIndex = parseInt(slot.dataset.slot, 10) - 1;
                activeTeam[slotIndex] = null;
                updateSlotUI(slotIndex);
                renderInventory();
            };
        });

        function handleHeroSelect(hero) {
            if (selectedSlot === null) selectedSlot = activeTeam.findIndex(id => id === null);
            if (selectedSlot === -1) selectedSlot = 0;
            activeTeam[selectedSlot] = hero.id;
            updateSlotUI(selectedSlot, hero);
            renderInventory();
            const nextEmpty = activeTeam.findIndex(id => id === null);
            if (nextEmpty !== -1) slots[nextEmpty].click();
        }

        function updateSlotUI(index, hero = null) {
            const slot = slots[index];
            const emptyEl = slot.querySelector('.slot-empty');
            const filledEl = slot.querySelector('.slot-filled');
            if (hero) {
                emptyEl.classList.add('hidden');
                filledEl.classList.remove('hidden');
                filledEl.querySelector('.hero-img').src = hero.img;
                filledEl.querySelector('.hero-name').innerText = hero.name;
                const qualityEl = filledEl.querySelector('.hero-quality');
                qualityEl.innerText = hero.quality;
                qualityEl.className = `hero-quality font-label-sm text-label-sm text-${qualityClasses[hero.quality] || 'quality-n'}`;
            } else {
                emptyEl.classList.remove('hidden');
                filledEl.classList.add('hidden');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return alert(msg);
            const txt = t.querySelector('span.font-title-md');
            if (txt) txt.innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none'), 2500);
        }

        saveBtn.addEventListener('click', async () => {
            const slotsPayload = activeTeam.map((heroId, idx) => ({ slot: idx + 1, player_hero_id: heroId || 0 })).filter(s => s.player_hero_id !== 0);
            if (slotsPayload.length === 0) return showToast('请至少上阵 1 名英雄');
            saveBtn.classList.add('scale-95');
            try {
                const data = await apiFetch('/api/v1/team/save', { method: 'POST', body: JSON.stringify({ slots: slotsPayload }) });
                showToast(data && data.code === 0 ? '保存成功' : '保存失败：' + (data && data.message ? data.message : '未知错误'));
            } catch (err) {
                showToast('网络错误，请稍后重试');
            } finally {
                saveBtn.classList.remove('scale-95');
            }
        });

        init();
    </script>
<script src="/static/assets/status-bar.js"></script>
<script src="/static/assets/app-shell.js"></script>
</body></html>
