        };

        async function apiFetch(path, opts = {}) {
            const token = localStorage.getItem('token');
            if (!token) return window.location.href = '/';
            const headers = opts.headers || {};
            headers['Content-Type'] = headers['Content-Type'] || 'application/json';
            headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(path, Object.assign({}, opts, { headers }));
            if (res.status === 401) {
                localStorage.removeItem('token');
                return window.location.href = '/';
            }
            return res.json();
        }

        async function loadAssets() {
            if (window.loadAssetBar) return window.loadAssetBar();
        }

        function updatePity(counter, limit = 90) {
            const safeLimit = Math.max(1, Number(limit) || 90);
            const safeCounter = Math.max(0, Number(counter) || 0);
            const counterEl = document.getElementById('pityCounter');
            const progressEl = document.getElementById('pityProgress');
            if (counterEl) counterEl.textContent = `${safeCounter} / ${safeLimit}`;
            if (progressEl) progressEl.style.width = `${Math.min(100, Math.round(safeCounter / safeLimit * 100))}%`;
        }

        async function loadPityState() {
            try {
                const data = await apiFetch('/api/v1/gacha/state?pool_id=1');
                if (data && data.code === 0 && data.data) {
                    updatePity(data.data.pity_counter, data.data.pity_limit);
                }
            } catch (err) {
                updatePity(0, 90);
            }
        }

        async function showResults(count) {
            const modal = document.getElementById('result-modal');
            const grid = document.getElementById('result-grid');
            const title = document.getElementById('modal-title');
            grid.innerHTML = '<div class="col-span-full text-center text-primary-fixed">召唤中...</div>';
            modal.classList.remove('hidden');
            title.classList.remove('opacity-0', 'translate-y-10');

            try {
                const data = await apiFetch('/api/v1/gacha/draw', {
                    method: 'POST',
                    body: JSON.stringify({ pool_id: 1, times: count })
                });
                if (!data || data.code !== 0) {
                    grid.innerHTML = `<div class="col-span-full text-center text-error">召唤失败：${data && data.message ? data.message : '未知错误'}</div>`;
                    return;
                }
                renderResults(data.data.results || []);
                if (window.loadAssetBar) window.loadAssetBar();
                updatePity(data.data.pity_counter, data.data.pity_limit);
            } catch (err) {
                grid.innerHTML = '<div class="col-span-full text-center text-error">网络错误，请稍后重试</div>';
            }
        }

        function renderResults(results) {
            const grid = document.getElementById('result-grid');
            grid.innerHTML = '';
            results.forEach((item, i) => {
                const rarity = qualityNames[item.quality] || 'N';
                const color = qualityColors[rarity];
                const isHero = item.item_type === 'hero';
                const name = isHero ? (heroNames[item.item_id] || `英雄 ${item.item_id}`) : `金币 x${item.item_count}`;
                const card = document.createElement('div');
                card.className = `opacity-0 transform scale-50 transition-all duration-500 flex flex-col items-center`;
                card.innerHTML = `
                    <div class="relative w-full aspect-square border-2 rounded-xl overflow-hidden shadow-2xl" style="border-color: ${color}">
                        ${isHero ? `<img src="${heroImages[item.item_id] || heroImages[1]}" class="w-full h-full object-cover" alt="${name}">` : `<div class="w-full h-full flex items-center justify-center bg-surface-container"><span class="material-symbols-outlined text-4xl" style="color: ${color}; font-variation-settings: 'FILL' 1;">account_balance_wallet</span></div>`}
                        <div class="absolute top-0 right-0 bg-black/60 px-2 py-0.5 text-[10px] font-label-sm" style="color: ${color}">${rarity}</div>
                    </div>
                    <span class="mt-2 font-label-sm text-center line-clamp-1">${name}${item.is_pity ? ' · 保底' : ''}</span>`;
                grid.appendChild(card);
                setTimeout(() => {
                    card.classList.remove('opacity-0', 'scale-50');
                    card.classList.add('opacity-100', 'scale-100');
                }, 10 + (i * 100));
            });
        }

        function closeResults() {
            document.getElementById('result-modal').classList.add('hidden');
            loadAssets();
        }

        loadAssets();
        loadPityState();
    </script>
<script src="/static/assets/status-bar.js"></script>
<script src="/static/assets/app-shell.js"></script>
</body></html>
