version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mini_card_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mini_card_game
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: mini_card_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: